
services:
  app:
    build:
      context: .
      dockerfile: app.dockerfile
    ports:
      - "8080:8501"
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - ollama

  ollama:
    build:
      context: .
      dockerfile: ollama.dockerfile
    ports: 
      - 11434:11434
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}

volumes:
  ollama_data:
